# Tells External Secrets how to reach AWS Secrets Manager. No credentials here: the operator's
# service account gets them through EKS Pod Identity (see infra/terraform/envs/dev/pod_identity.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1   # keep in sync with var.region in Terraform
