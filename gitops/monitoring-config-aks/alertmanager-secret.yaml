# Same as monitoring-config/, sourced from Azure Key Vault (secret "alertmanager-slack-webhook", created by Terraform
# with a placeholder; set the real one:
#   az keyvault secret set --vault-name <kv> --name alertmanager-slack-webhook --value "https://hooks.slack.com/services/...")
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack
  data:
    - secretKey: url
      remoteRef:
        key: alertmanager-slack-webhook
