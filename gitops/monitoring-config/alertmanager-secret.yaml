# Alertmanager reads its Slack webhook from a file. This ExternalSecret materialises it in the monitoring
# namespace from AWS Secrets Manager (secret created by Terraform with a placeholder value; set the real one:
#   aws secretsmanager put-secret-value --secret-id <slack_webhook_secret_name> --secret-string "https://hooks.slack.com/services/...")
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack
  data:
    - secretKey: url
      remoteRef:
        key: REPLACE_WITH_slack_webhook_secret_name
