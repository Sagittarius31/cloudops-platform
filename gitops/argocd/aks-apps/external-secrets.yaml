# External Secrets Operator on AKS, authenticated to Key Vault through Azure Workload Identity.
# Replace the REPLACE_* values with `terraform output` values from infra/terraform/envs/azure-dev.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.17.0
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets   # must match the federated credential subject in Terraform
          annotations:
            azure.workload.identity/client-id: REPLACE_WITH_ESO_CLIENT_ID
            azure.workload.identity/tenant-id: REPLACE_WITH_TENANT_ID
        podLabels:
          azure.workload.identity/use: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
