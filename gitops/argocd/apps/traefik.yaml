# Ingress controller (ingress-nginx was retired in March 2026 and no longer gets security fixes).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.5.0
    helm:
      valuesObject:
        ingressClass:
          enabled: true
          isDefaultClass: true
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true   # writes the load-balancer address into Ingress status
        service:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
