# One-time helper: generates and commits app/go.sum (needed before CI and `docker build` can work).
# Run it from the repo's "Actions" tab -> "bootstrap-go-sum" -> "Run workflow". No local Go needed.
name: bootstrap-go-sum

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false
      - name: go mod tidy
        working-directory: app
        run: go mod tidy
      - name: Commit go.mod / go.sum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/go.mod app/go.sum
          git diff --cached --quiet || git commit -m "chore: generate go.sum"
          git push
