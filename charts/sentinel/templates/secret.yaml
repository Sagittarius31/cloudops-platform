{{- if and .Values.postgres.enabled (not .Values.externalSecrets.enabled) }}
# Mode A (dev only): credentials live in values/Git. Use externalSecrets for anything real.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-app
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.user .Values.postgres.password (include "sentinel.fullname" .) .Values.postgres.db | quote }}
  API_TOKENS: {{ .Values.auth.token | quote }}
  {{- if .Values.auth.readToken }}
  API_READ_TOKENS: {{ .Values.auth.readToken | quote }}
  {{- end }}
{{- end }}
