{{- if .Values.externalSecrets.enabled }}
# Mode B (production): builds the app Secret from an external secret store.
#  source=rds    -> AWS: RDS-managed {username,password} secret + host value -> DATABASE_URL
#  source=direct -> any store (e.g. Azure Key Vault) that already holds a full DATABASE_URL
{{- $ssl := "sslmode=require" }}
{{- if eq .Values.externalSecrets.sslMode "verify-full" }}
{{- $ssl = "sslmode=verify-full&sslrootcert=/certs/rds-ca.pem" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sentinel.fullname" . }}-app
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "sentinel.fullname" . }}-app
    creationPolicy: Owner
    template:
      data:
        {{- if eq .Values.externalSecrets.source "rds" }}
        DATABASE_URL: {{ printf "postgres://{{ .username }}:{{ .password | urlquery }}@%s:5432/%s?%s" (required "externalSecrets.rdsHost is required" .Values.externalSecrets.rdsHost) .Values.externalSecrets.dbName $ssl | quote }}
        {{- else if eq .Values.externalSecrets.source "direct" }}
        DATABASE_URL: {{ "{{ .database_url }}" | quote }}
        {{- else }}
        {{- fail "externalSecrets.source must be 'rds' or 'direct'" }}
        {{- end }}
        API_TOKENS: {{ "{{ .api_token }}" | quote }}
        {{- if .Values.externalSecrets.readTokenSecretName }}
        API_READ_TOKENS: {{ "{{ .read_token }}" | quote }}
        {{- end }}
  data:
    {{- if eq .Values.externalSecrets.source "rds" }}
    - secretKey: username
      remoteRef:
        key: {{ required "externalSecrets.rdsSecretArn is required" .Values.externalSecrets.rdsSecretArn }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.rdsSecretArn }}
        property: password
    {{- else }}
    - secretKey: database_url
      remoteRef:
        key: {{ required "externalSecrets.databaseUrlSecretName is required" .Values.externalSecrets.databaseUrlSecretName }}
    {{- end }}
    - secretKey: api_token
      remoteRef:
        key: {{ required "externalSecrets.apiTokenSecretName is required" .Values.externalSecrets.apiTokenSecretName }}
    {{- if .Values.externalSecrets.readTokenSecretName }}
    - secretKey: read_token
      remoteRef:
        key: {{ .Values.externalSecrets.readTokenSecretName }}
    {{- end }}
{{- end }}
