# Azure AKS cluster, Mode A (in-cluster Postgres).
image:
  repository: "REPLACE_WITH_ACR_LOGIN_SERVER/sentinel"   # terraform output acr_login_server
  tag: "REPLACE_WITH_TAG"
serviceMonitor:
  enabled: true
prometheusRule:
  enabled: true
networkPolicy:
  enabled: true
  ingressNamespaces: ["monitoring", "traefik"]   # Prometheus + the Traefik ingress controller
